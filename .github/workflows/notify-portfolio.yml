name: Notify portfolio site

# Fires after the main profile art workflow succeeds.
# Sends a repository_dispatch event to Kesicode.github.io so it immediately
# pulls the freshly-updated contributions.json.
#
# REQUIRES: GH_PAT secret with "repo" scope — same secret already used here.

on:
  workflow_run:
    workflows: ["Update profile art"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio sync
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Kesicode/Kesicode.github.io/dispatches \
              -d '{"event_type":"profile-data-updated","client_payload":{"source":"Kesicode/Kesicode"}}'
            echo "✓ Dispatched profile-data-updated to Kesicode.github.io"
          else
            echo "⚠ GH_PAT secret not set; relying on Kesicode.github.io automated cron sync."
          fi
