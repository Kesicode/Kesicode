name: Update profile art

# Refreshes the contribution graph SVG from real data.
# Runs 4 times daily (00:00, 06:00, 12:00, and 18:00 UTC), plus whenever you push to main.

"on":
  schedule:
    - cron: "0 0,6,12,18 * * *"   # 00:00, 06:00, 12:00, and 18:00 UTC every day
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated streak SVG
        run: python scripts/generate_streak_svg.py Kesicode contrib-heatmap.svg

      - name: Render contribution graph SVG (boxes)
        run: python scripts/render_heatmap_svg.py

      - name: Rotate README layout based on time of day
        run: python scripts/rotate_readme_layout.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph & rotate layout [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg README.md"
